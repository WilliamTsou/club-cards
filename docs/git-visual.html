<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 動畫圖解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 版面：上方章節列，中間是 16:9 的動畫舞台，下方是指令與說明；舞台裡的東西用同一組座標（800×450）擺放 */
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --zone: #f7f9fc;
    --ink: #172033;
    --muted: #5d6879;
    --line: #cfd6e0;
    --main: #2563c9;   /* main 分支、老師的 repo */
    --feat: #d4731b;   /* 你的分支、你的 fork */
    --head: #b8237a;   /* HEAD */
    --ok: #18864b;
    --okbg: #e3f4ea;
    --bad: #c93636;
    --badbg: #fbe7e7;
    --note: #fff6d9;
    --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141c; --surface: #18202c; --zone: #141b25; --ink: #e6ebf3; --muted: #97a3b5; --line: #2e3a4b;
      --main: #5b93f0; --feat: #f0954a; --head: #e0559f; --ok: #3fbf78; --okbg: #13301f; --bad: #ef6464; --badbg: #3a1717; --note: #33301c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141c; --surface: #18202c; --zone: #141b25; --ink: #e6ebf3; --muted: #97a3b5; --line: #2e3a4b;
    --main: #5b93f0; --feat: #f0954a; --head: #e0559f; --ok: #3fbf78; --okbg: #13301f; --bad: #ef6464; --badbg: #3a1717; --note: #33301c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
  header h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 3.5vw, 2.1rem); margin: 0; text-wrap: balance; }
  header p { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }

  nav.chapters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  nav.chapters button {
    flex: 0 0 auto; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    font: 600 .92rem var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }
  nav.chapters button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  nav.chapters button:focus-visible, .controls button:focus-visible { outline: 3px solid var(--head); outline-offset: 2px; }

  .panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
  .panel-head { padding: 16px 20px 0; }
  .panel-head h2 { font-family: var(--font-display); margin: 0; font-size: 1.3rem; text-wrap: balance; }
  .panel-head p { margin: 4px 0 0; color: var(--muted); }
  .panel-head .ref { display: inline-block; margin-top: 8px; font-size: .85rem; font-weight: 700; color: var(--head); background: var(--bg); padding: 2px 10px; border-radius: 999px; }

  .stage-scroll { overflow-x: auto; padding: 12px 20px; }
  .stage { position: relative; aspect-ratio: 16 / 9; min-width: 620px; background: var(--bg); border-radius: 12px; overflow: hidden; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  .el { position: absolute; transform: translate(-50%, -50%); white-space: pre-line; text-align: center; line-height: 1.35;
        transition: left .7s ease, top .7s ease, opacity .45s ease, background-color .45s, color .45s, border-color .45s; }
  .zone { border: 2px dashed var(--line); border-radius: 1em; background: var(--zone); color: var(--muted); font-weight: 700;
          display: flex; align-items: flex-start; justify-content: center; padding-top: .45em; font-size: .95em; }
  .zone.on { border-style: solid; border-color: var(--head); color: var(--head); }
  .zone.bad { border-color: var(--bad); color: var(--bad); background: var(--badbg); }
  .node { width: 3em; height: 3em; border-radius: 50%; background: var(--main); color: #fff; display: grid; place-items: center;
          font: 700 .82em var(--font-mono); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--main); }
  .node.feat { background: var(--feat); box-shadow: 0 0 0 2px var(--feat); }
  .node.ghost { background: var(--surface); color: var(--muted); box-shadow: 0 0 0 2px var(--muted); border-style: dashed; }
  .node.squash { background: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
  .tag { padding: .15em .65em; border-radius: 999px; background: var(--main); color: #fff; font: 700 .78em var(--font-mono); }
  .tag.feat { background: var(--feat); }
  .tag.head { background: var(--head); }
  .tag.ghost { background: transparent; color: var(--muted); border: 1.5px dashed var(--muted); }
  .tag.plain { background: var(--ink); color: var(--bg); }
  .card { background: var(--surface); border: 1.5px solid var(--line); border-left: 6px solid var(--muted); border-radius: .5em;
          padding: .35em .7em; font: 600 .8em var(--font-mono); text-align: left; }
  .card.mod { border-left-color: var(--bad); }
  .card.staged { border-left-color: var(--ok); }
  .card.commit { border-left-color: var(--main); }
  .card.key { border-left-color: var(--head); }
  .card.bad { border-color: var(--bad); background: var(--badbg); }
  .repo { background: var(--surface); border: 2px solid var(--ink); border-radius: .6em; padding: .45em .8em; font-size: .82em; font-weight: 700; }
  .repo.up { border-color: var(--main); }
  .repo.fork { border-color: var(--feat); }
  .gate { background: var(--ink); color: var(--bg); border-radius: .6em; padding: .5em .7em; font-size: .8em; font-weight: 700; }
  .note { background: var(--note); color: var(--ink); border-radius: .45em; padding: .3em .65em; font-size: .78em; }
  .note.ok { background: var(--okbg); color: var(--ok); font-weight: 700; }
  .note.bad { background: var(--badbg); color: var(--bad); font-weight: 700; }
  .code { background: var(--surface); border: 1.5px solid var(--line); border-radius: .3em; padding: .15em .5em;
          font: 600 .76em var(--font-mono); text-align: left; }
  .code.add { border-color: var(--ok); background: var(--okbg); }
  .code.ours { border-color: var(--head); }
  .code.theirs { border-color: var(--feat); }
  .code.mark { color: var(--bad); background: var(--badbg); border-color: var(--bad); }
  .colhead { font-size: .76em; font-weight: 700; color: var(--muted); }

  .ln { stroke: var(--muted); stroke-width: 2.2; fill: none; transition: opacity .45s; }
  .ln.main { stroke: var(--main); } .ln.feat { stroke: var(--feat); }
  .ln.ok { stroke: var(--ok); } .ln.bad { stroke: var(--bad); }
  .ln.dash { stroke-dasharray: 7 6; }
  .lbl { font: 700 12.5px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; transition: opacity .45s; }

  .below { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 4px 20px 20px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .controls button { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
                     padding: 8px 14px; font: 600 .95rem var(--font-body); cursor: pointer; }
  .controls button.primary { background: var(--head); border-color: var(--head); color: #fff; }
  .controls button:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; }
  .dots button[aria-current="true"] { background: var(--head); }
  .counter { font: 600 .9rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .cmd { margin: 0; background: #111827; color: #e5edf8; border-radius: 10px; padding: 10px 14px; font: 600 .92rem var(--font-mono);
         overflow-x: auto; white-space: pre; min-height: 2.6em; }
  .cmd:empty::before { content: "（這一步不用打指令）"; color: #8b98ab; font-family: var(--font-body); font-weight: 500; }
  .say { max-width: 70ch; font-size: 1.02rem; }
  .say code, .points code { font-family: var(--font-mono); font-size: .9em; background: var(--bg); padding: .05em .35em; border-radius: 4px; }
  .points { border-top: 1.5px solid var(--line); padding: 14px 20px 18px; }
  .points h3 { margin: 0 0 6px; font-size: 1rem; }
  .points ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 75ch; }
  footer { color: var(--muted); font-size: .88rem; }

  @media (prefers-reduced-motion: reduce) {
    .el, .ln, .lbl { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Git 動畫圖解</h1>
    <p>章節順序跟講義一樣，上到哪一段就打開對應的章節。每一章用「上一步／下一步」看指令背後發生了什麼，鍵盤左右鍵也可以翻頁。</p>
  </header>

  <nav class="chapters" id="chapters" aria-label="章節"></nav>

  <section class="panel" aria-live="polite">
    <div class="panel-head">
      <h2 id="ch-title"></h2>
      <p id="ch-lead"></p>
      <p class="ref" id="ch-ref"></p>
    </div>
    <div class="stage-scroll">
      <div class="stage" id="stage">
        <svg viewBox="0 0 800 450" id="svg" aria-hidden="true">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
            <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ok)"/></marker>
            <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker>
            <marker id="ar-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--main)"/></marker>
            <marker id="ar-feat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--feat)"/></marker>
          </defs>
          <g id="lines"></g>
        </svg>
      </div>
    </div>
    <div class="below">
      <div class="controls">
        <button id="prev" type="button">◀ 上一步</button>
        <button id="play" type="button" class="primary">▶ 自動播放</button>
        <button id="next" type="button">下一步 ▶</button>
        <span class="counter" id="counter"></span>
        <div class="dots" id="dots" aria-label="步驟"></div>
      </div>
      <pre class="cmd" id="cmd"></pre>
      <div class="say" id="say"></div>
    </div>
    <div class="points">
      <h3>這一章的重點</h3>
      <ul id="points"></ul>
    </div>
  </section>

  <footer>專案組 Git 教學 · 搭配講義 docs/handout.md 使用</footer>
</div>

<script>
/* ---------- 章節資料 ----------
   els：舞台上的東西（type 決定外觀）；steps：每一步要改的狀態（會累加到下一步）
   狀態欄位：x,y 中心座標（800×450）、w,h 寬高、o 透明度、t 文字、c 額外樣式
   ln：線條，a/b 起訖點、o 透明度、c 樣式、lab 標籤、arrow 是否加箭頭 */
const CH = [
{
  id: 'folders', nav: '資料夾與 git init',
  ref: '講義 1-2 告訴 Git 你是誰、講義 2 終端機尋寶',
  title: '資料夾、git init 和設定的範圍',
  lead: 'Git 只管「有 .git 的那個資料夾，和它裡面的所有東西」。設定也分「整台電腦」和「只有這個 repo」兩種範圍。',
  els: {
    home: { type: 'zone', t: '~ 家目錄（Windows：C:\\Users\\你　Mac：/Users/你）' },
    my: { type: 'zone', t: 'my-card/' },
    cc: { type: 'zone', t: 'club-cards/' },
    f1: { type: 'card', t: 'index.html' }, f2: { type: 'card', t: 'avatar.jpg' },
    g1: { type: 'card', t: 'index.html' }, g2: { type: 'card', t: 'cards/' },
    gm: { type: 'tag', c: 'head', t: '.git' }, gc: { type: 'tag', c: 'head', t: '.git' },
    nest: { type: 'zone', t: 'club-cards/（裝錯地方）' },
    gl: { type: 'card', c: 'key', t: '~/.gitconfig（--global）\n整台電腦的所有 repo 都用' },
    lc: { type: 'card', c: 'commit', t: '.git/config\n不加 --global：只有這個 repo 用' },
    n1: { type: 'note' }, n2: { type: 'note' }
  },
  steps: [
    { cmd: 'cd ~\nls', say: '資料夾就像房間。<code>~</code> 是你的<b>家目錄</b>，今天的東西都放在這裡。現在家裡有兩個資料夾：w10 做的 <code>my-card</code>，和等一下會出現的 <code>club-cards</code>。',
      set: { home: { x: 400, y: 245, w: 770, h: 400 }, my: { x: 200, y: 285, w: 300, h: 270 }, cc: { x: 595, y: 285, w: 320, h: 270 },
             f1: { x: 200, y: 250 }, f2: { x: 200, y: 295 } } },
    { cmd: 'cd ~/my-card\ngit status', say: '在 my-card 裡打 Git 指令，會得到 <code>fatal: not a git repository</code>。因為這個資料夾<b>沒有 .git</b>，Git 根本不管它。',
      set: { n1: { x: 200, y: 200, t: '✗ not a git repository', c: 'bad' } } },
    { cmd: 'git init', say: '<code>git init</code> 會在<b>目前這個資料夾</b>裡建一個隱藏的 <code>.git</code> 資料夾，也就是儲存庫，所有 commit 紀錄都存在裡面。<code>ls -a</code> 才看得到它。',
      set: { n1: { o: 0 }, gm: { x: 315, y: 175 }, my: { c: 'on' } } },
    { cmd: '', say: '從現在起，<b>my-card 和它裡面的所有子資料夾</b>都歸這個 .git 管。範圍以外的地方（例如家目錄、隔壁的 club-cards）完全不受影響。所以打 Git 指令前，先 <code>pwd</code> 確認自己在哪個資料夾。',
      set: { n1: { o: 1, x: 200, y: 200, t: 'Git 的範圍：my-card 整個資料夾', c: 'ok' } } },
    { cmd: 'cd ~\ngit clone https://github.com/你的帳號/club-cards.git', say: '<code>git clone</code> 下載下來的資料夾<b>已經自帶 .git</b>，不用再 <code>git init</code>。<code>git init</code> 是「從零開始一個新專案」才用。',
      set: { n1: { o: 0 }, gc: { x: 725, y: 175 }, g1: { x: 595, y: 250 }, g2: { x: 595, y: 295 } } },
    { cmd: 'cd ~/my-card\ngit clone https://github.com/你的帳號/club-cards.git   # ✗ 錯誤示範', say: '常見錯誤：<b>在 my-card 裡面 clone</b>。結果變成 repo 裡面又有 repo，外層的 Git 會把整包當成一個奇怪的東西，之後 add、commit 都會亂掉。clone 前先 <code>cd ~</code> 回家。',
      set: { nest: { x: 200, y: 375, w: 230, h: 70, c: 'bad' }, n2: { x: 200, y: 200, t: '✗ repo 裡面又有 repo', c: 'bad' } } },
    { cmd: 'git config --global user.name "Amy"', say: '設定也有範圍：加 <code>--global</code> 會寫進家目錄的 <code>~/.gitconfig</code>，<b>整台電腦的所有 repo</b> 都用；不加的話寫進那個 repo 的 <code>.git/config</code>，<b>只有那個 repo</b> 用。兩邊都有時，以 repo 自己的為準。',
      set: { nest: { o: 0 }, n2: { o: 0 }, gl: { x: 400, y: 102 }, lc: { x: 595, y: 370 } } }
  ],
  points: [
    '<code>~</code> = 家目錄；<code>.</code> = 這裡；<code>..</code> = 上一層',
    'Git 只管「有 .git 的資料夾和它裡面所有東西」，範圍外打 Git 指令會出現 not a git repository',
    '<code>git init</code> = 從零開始一個新 repo；<code>git clone</code> 下載的已經有 .git，不用 init',
    '不要在一個 repo 裡面再 clone 另一個 repo，clone 前先 <code>cd ~</code>',
    '<code>--global</code> 的設定整台電腦都用；不加只有目前這個 repo 用'
  ]
},
{
  id: 'areas', nav: '三個區域',
  ref: '講義 1「先懂四件事」、講義 3 Step 8',
  title: '為什麼要分工作區、暫存區、儲存庫',
  lead: '多一個暫存區，是為了讓你「挑」要存哪些東西，讓每筆紀錄只做一件事。',
  els: {
    zW: { type: 'zone', t: '工作區\n你正在改的檔案' },
    zS: { type: 'zone', t: '暫存區（staging）\n挑好、準備要存的' },
    zR: { type: 'zone', t: '儲存庫 .git\n存好的紀錄（commit）' },
    f: { type: 'card', t: 'index.html' }, a: { type: 'card', t: 'avatar.jpg' }, x: { type: 'card', t: 'test.txt' },
    c1: { type: 'card', c: 'commit', t: 'a1b2c3d\nfeat: 新增名片和頭像' },
    c2: { type: 'card', c: 'commit', t: 'e4f5a6b\nstyle: 換配色' },
    w1: { type: 'note' }, w2: { type: 'note' }, w3: { type: 'note' }, lg: { type: 'code' }
  },
  steps: [
    { cmd: '', say: 'Git 把一個 repo 分成三個區域。你在 VS Code 改檔案，都是在最左邊的<b>工作區</b>。',
      set: { zW: { x: 150, y: 245, w: 230, h: 360 }, zS: { x: 400, y: 245, w: 230, h: 360 }, zR: { x: 650, y: 245, w: 230, h: 360 },
             f: { x: 150, y: 150 }, a: { x: 150, y: 200 }, x: { x: 150, y: 250 } } },
    { cmd: 'git status', say: '你改了名片、換了頭像，還順手建了一個亂寫的 <code>test.txt</code>。<code>git status</code> 用<b>紅字</b>列出這三個改過、還沒放進暫存區的檔案。',
      set: { f: { c: 'mod' }, a: { c: 'mod' }, x: { c: 'mod' } } },
    { cmd: 'git add index.html avatar.jpg', say: '<b>為什麼要有暫存區？</b>因為你可以<b>挑</b>。像寄包裹：先決定哪些東西放進箱子，<code>test.txt</code> 是試驗用的，不想存，就不放進去。只放進去的兩個會變<b>綠字</b>。',
      set: { f: { x: 400, c: 'staged' }, a: { x: 400, c: 'staged' } } },
    { cmd: 'git commit -m "feat: 新增名片和頭像"', say: '<code>git commit</code> 把暫存區裡的東西封箱寄出，在儲存庫留下一筆<b>快照</b>，有自己的編號（hash）和說明。<code>test.txt</code> 沒放進暫存區，所以<b>沒被存進去</b>，還留在工作區。',
      set: { c1: { x: 650, y: 150, w: 210 }, f: { x: 150, c: '' }, a: { x: 150, c: '' } } },

    'Git 合併時做「三方比對」：你的、別人的，各自跟共同祖先比',
    '改到不同地方 → 自動合併；改到同一個地方 → 衝突',
    '<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> 那段是你的，<code>=======</code> 下面是別人的',
    '解法：決定要留什麼 → 刪掉三種標記 → <code>git add</code> → <code>git commit</code>',
    '三種常見情況：都是新增（都留）、同一行不同意思（去問對方）、別人改了規則（照新版改）'
  ]
}
];

/* ---------- 播放器 ---------- */
const stage = document.getElementById('stage');
const linesG = document.getElementById('lines');
const $ = id => document.getElementById(id);
let ch = null, step = 0, timer = null, nodes = {}, lnodes = {};

function cum(chap, i) {
  const s = {}, l = {};
  for (let k = 0; k <= i; k++) {
    const st = chap.steps[k];
    for (const id in (st.set || {})) s[id] = Object.assign({}, s[id], st.set[id]);
    for (const id in (st.ln || {})) l[id] = Object.assign({}, l[id], st.ln[id]);
  }
  return { s, l };
}
function firstPos(chap, id, key) {
  for (const st of chap.steps) {
    const v = (st[key] || {})[id];
    if (v && (v.x != null || v.a)) return v;
  }
  return {};
}
const pctX = v => (v / 800 * 100) + '%';
const pctY = v => (v / 450 * 100) + '%';

function build(chap) {
  stage.querySelectorAll('.el').forEach(n => n.remove());
  linesG.innerHTML = '';
  nodes = {}; lnodes = {};
  for (const id in chap.els) {
    const d = chap.els[id];
    const n = document.createElement('div');
    n.className = 'el ' + d.type;
    n.style.transition = 'none';
    const p = firstPos(chap, id, 'set');
    n.style.left = pctX(p.x ?? 400); n.style.top = pctY(p.y ?? 225); n.style.opacity = 0;
    if (d.type === 'zone') n.style.zIndex = 0; else n.style.zIndex = 2;
    stage.appendChild(n); nodes[id] = n;
  }
  const ids = new Set();
  chap.steps.forEach(st => Object.keys(st.ln || {}).forEach(k => ids.add(k)));
  ids.forEach(id => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('class', 'lbl'); text.setAttribute('text-anchor', 'middle');
    g.appendChild(line); g.appendChild(text); g.style.opacity = 0;
    linesG.appendChild(g); lnodes[id] = { g, line, text };
  });
  requestAnimationFrame(() => Object.values(nodes).forEach(n => n.style.transition = ''));
}

function render() {
  const chap = ch, { s, l } = cum(chap, step);
  for (const id in chap.els) {
    const d = chap.els[id], n = nodes[id], st = s[id];
    if (!st) { n.style.opacity = 0; continue; }
    n.className = 'el ' + d.type + ' ' + (st.c ?? d.c ?? '');
    if (st.x != null) n.style.left = pctX(st.x);
    if (st.y != null) n.style.top = pctY(st.y);
    if (st.w != null) n.style.width = pctX(st.w);
    if (st.h != null) n.style.height = pctY(st.h);
    n.textContent = st.t ?? d.t ?? '';
    n.style.opacity = st.o ?? 1;
  }
  for (const id in lnodes) {
    const L = lnodes[id], st = l[id];
    if (!st) { L.g.style.opacity = 0; continue; }
    const [x1, y1] = st.a, [x2, y2] = st.b;
    L.line.setAttribute('x1', x1); L.line.setAttribute('y1', y1); L.line.setAttribute('x2', x2); L.line.setAttribute('y2', y2);
    const cls = st.c || '';
    L.line.setAttribute('class', 'ln ' + cls);
    const color = ['ok', 'bad', 'main', 'feat'].find(c => cls.split(' ').includes(c));
    if (st.arrow) L.line.setAttribute('marker-end', 'url(#ar' + (color ? '-' + color : '') + ')'); else L.line.removeAttribute('marker-end');
    L.text.textContent = st.lab || '';
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const horiz = Math.abs(y2 - y1) < 20;
    L.text.setAttribute('x', horiz ? mx : mx + 10); L.text.setAttribute('y', horiz ? my - 9 : my);
    L.text.setAttribute('text-anchor', horiz ? 'middle' : 'start');
    L.g.style.opacity = st.o ?? 1;
  }
  const cur = chap.steps[step];
  $('cmd').textContent = cur.cmd;
  $('say').innerHTML = cur.say;
  $('counter').textContent = (step + 1) + ' / ' + chap.steps.length;
  $('prev').disabled = step === 0;
  $('next').disabled = step === chap.steps.length - 1;
  [...$('dots').children].forEach((b, i) => b.setAttribute('aria-current', i === step));
}

function openChapter(id, keepHash) {
  stop();
  ch = CH.find(c => c.id === id) || CH[0];
  step = 0;
  $('ch-title').textContent = ch.title;
  $('ch-lead').textContent = ch.lead;
  $('ch-ref').textContent = '對應講義：' + ch.ref;
  $('points').innerHTML = ch.points.map(p => '<li>' + p + '</li>').join('');
  [...$('chapters').children].forEach(b => b.setAttribute('aria-current', b.dataset.id === ch.id));
  $('dots').innerHTML = '';
  ch.steps.forEach((_, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', '第 ' + (i + 1) + ' 步');
    b.onclick = () => { stop(); step = i; render(); };
    $('dots').appendChild(b);
  });
  build(ch);
  requestAnimationFrame(() => requestAnimationFrame(render));
  if (!keepHash) { try { history.replaceState(null, '', '#' + ch.id); } catch (e) { location.hash = ch.id; } }
}

function go(d) { const n = step + d; if (n < 0 || n >= ch.steps.length) return false; step = n; render(); return true; }
function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ 自動播放'; }
function play() {
  if (timer) return stop();
  if (step === ch.steps.length - 1) { step = 0; render(); }
  $('play').textContent = '⏸ 暫停';
  timer = setInterval(() => { if (!go(1)) stop(); }, 4200);
}

CH.forEach(c => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = (CH.indexOf(c) + 1) + ' ' + c.nav; b.dataset.id = c.id;
  b.onclick = () => openChapter(c.id);
  $('chapters').appendChild(b);
});
$('prev').onclick = () => { stop(); go(-1); };
$('next').onclick = () => { stop(); go(1); };
$('play').onclick = play;
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight') { stop(); go(1); }
  if (e.key === 'ArrowLeft') { stop(); go(-1); }
});
new ResizeObserver(() => { stage.style.fontSize = (stage.clientWidth / 800 * 15) + 'px'; }).observe(stage);
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (!ch || id !== ch.id) openChapter(id, true); });
openChapter(location.hash.slice(1), true);
</script>
</body>
</html>
