<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>沫沫的名片</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg: linear-gradient(to right bottom, #394a60, #1f2331);
            --text: #e9e9e9;
            --accent: #90daff;
            --accent-soft: #6db9df;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }

        /* 整頁：卡片至少和視窗一樣高，左右分欄 */
        .card {
            min-height: 100vh;
            display: flex;
        }

        /* 左欄：約三分之一寬，內容垂直＋水平置中 */
        .card__profile {
            flex: 0 0 35%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            border-right: 2px solid var(--accent-soft);
        }

        .card__avatar {
            width: 220px;
            height: 220px;
            border: 50px;
            box-shadow: rgb(17, 17, 17);
            /*border-radius: 50%;*/
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card__avatar:hover {
            transform: scale(1.05);
        }

        .card__name {
            margin: 24px 0 4px;
            font-size: 2.5rem;
            color: var(--accent);
            display: inline-block; /* 確保 transform: scale() 能正常運作，且漸層緊貼文字寬度 */
            transition: transform 0.3s ease; /* 讓放大效果更平滑 */
        }

        .card__name:hover {
            transform: scale(1.05);
            
            /* 1. 以原本的 --accent 為主色，搭配亮色做出流光漸層 */
            background-image: linear-gradient(
                45deg, 
                var(--accent) 0%, 
                #d8f8ff 25%, 
                #6dcdf3 50%, 
                #d8f8ff 75%,
                var(--accent) 100%
            );
            background-size: 200% auto;
    
            /* 2. 將漸層裁切進文字裡 */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            /* 3. 啟動顏色流動動畫 */
            animation: textFlow 2.5s linear infinite;
        }

        @keyframes textFlow {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }


        .card__nickname {
            margin: 0;
            font-size: 1.25rem;
            color: var(--accent-soft);
        }

        /* 右欄：吃掉剩下的空間，內容垂直置中 */
        .card__content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 32px 64px;
        }

        .card__content h2 {
            margin-top: 0;
            font-size: 2rem;
            color: white;
        }

        .card__content ol {
            font-size: 1.25rem;
            line-height: 1.9;
        }

        

        /* 選做：視窗太窄時改成上下排列 */
        @media (max-width: 700px) {
            .card {
                flex-direction: column;
            }

            .card__profile {
                flex-basis: auto;
                border-right: none;
                border-bottom: 2px solid var(--accent-soft);
            }

            .card__content {
                padding: 32px;
            }
        }  
    </style>
  </head>
  <body>
    <main>
      <article class="card">

        <header class="card__profile">
          <img src="momo.png" alt="沫沫的頭像" class="card__avatar">
          <h1 class="card__name">沫沫</h1>
          <p class="card__nickname">aka 鮭魚</p>
        </header>

        <section class="card__content">
          <h2>GDGoC NTUST 5th 吉祥物</h2>
          <ol>
            <li>沫沫很可愛</li>
            <li>沫沫是鯨魚</li>
            <li>沫沫會工作（但不喜歡加班）</li>
          </ol>
        </section>

      </article>
    </main>
  </body>
</html>
