<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>專案組名片牆</title>
    <style>
      /* 配色變數：跟 w10 名片作業一樣的五色寫法 */
      :root {
        --bg: #f6f5f2;
        --surface: #ffffff;
        --text: #1f2328;
        --text-soft: #656d76;
        --accent: #1a73e8;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Noto Sans TC", sans-serif;
        line-height: 1.6;
      }

      .wall {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      .wall__title {
        margin: 0;
        font-size: 2.25rem;
        color: var(--accent);
        letter-spacing: 0.05em;
      }

      .wall__subtitle {
        margin: 8px 0 40px;
        color: var(--text-soft);
      }

      .members {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      .members a {
        display: block;
        padding: 20px;
        background: var(--surface);
        border: 1px solid #e3e1db;
        border-radius: 12px;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.15s, border-color 0.15s;
      }

      .members a:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }

      .wall__footer {
        margin-top: 48px;
        font-size: 0.9rem;
        color: var(--text-soft);
      }

      .wall__footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="wall">
      <header>
        <h1 class="wall__title">專案組名片牆</h1>
        <p class="wall__subtitle">點一個名字，認識一位夥伴</p>
      </header>

      <nav aria-label="成員名片">
        <!--
          加上你自己：依「GitHub 帳號」的字母順序，插在對的位置（a 在最上面，z 在最下面）
          格式：<li><a href="cards/你的GitHub帳號/index.html">你的名字</a></li>
        -->

        <ul class="members">
          <li><a href="cards/williamtsou-demo/index.html">william-test</a></li>
          <li><a href="cards/williamtsou-demo/index.html">william-test2</a></li>
          <!-- 往下接 -->
          <li><a href="cards/ruth1030/index.html">沫沫</a></li>

        </ul>
      </nav>

      <footer class="wall__footer">
        想把自己加進來？請看
        <a href="https://github.com/williamtsou/club-cards/blob/main/CONTRIBUTING.md">參與方式</a>
      </footer>
    </main>
  </body>
</html>
